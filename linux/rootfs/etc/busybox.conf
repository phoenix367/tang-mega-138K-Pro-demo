# /etc/busybox.conf -- busybox FEATURE_SUID_CONFIG.
#
# Consulted ONLY by the setuid-root /bin/ping copy (see /etc/init.d/rcS): the
# main /bin/busybox is NOT setuid, so this file does not affect any other applet
# or the boot scripts. It lets an unprivileged user run ping (which needs a raw
# ICMP socket / CAP_NET_RAW) by keeping root for the ping applet only.
[SUID]
ping  = ssx root.root
ping6 = ssx root.root
